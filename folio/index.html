<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dotspace — Your work. Professionally organized.</title>

  <!-- Typography: Inter, Playfair Display & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- html2pdf.js CDN for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Navigation Sidebar -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="appSidebar">
      <div>
        <div class="brand-header">
          <img src="/logo.svg" alt="dotspace logo" class="brand-logo-img" />
          <div class="brand-title">
            <span>dotspace</span>
            <span class="brand-tagline">Private Workspace</span>
          </div>
          <button class="mobile-close-btn" id="mobileMenuClose">✕</button>
        </div>

        <nav class="nav-section">
          <a class="nav-item active" data-view="home">
            <i data-lucide="layout-dashboard"></i>
            <span>Home</span>
          </a>
          <a class="nav-item" data-view="documents">
            <i data-lucide="file-text"></i>
            <span>Documents</span>
          </a>
          <a class="nav-item" data-view="work">
            <i data-lucide="kanban"></i>
            <span>Work Board</span>
          </a>
          <a class="nav-item" data-view="contacts">
            <i data-lucide="users"></i>
            <span>Contacts</span>
          </a>
          <a class="nav-item" data-view="history">
            <i data-lucide="clock"></i>
            <span>History</span>
          </a>
          <a class="nav-item" data-view="calendar">
            <i data-lucide="calendar"></i>
            <span>Calendar</span>
          </a>
          <a class="nav-item" data-view="profile">
            <i data-lucide="user-check"></i>
            <span>Brand Profile</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-footer">
        <!-- Tier / Usage Widget -->
        <div class="tier-card" id="tierWidget">
          <div class="tier-header">
            <span id="tierBadge">FREE PLAN</span>
            <span id="docCountText">3/5 DOCS</span>
          </div>
          <div class="tier-progress-bar">
            <div class="tier-progress-fill" id="tierProgressFill" style="width: 60%;"></div>
          </div>
          <button class="btn btn-secondary btn-sm" style="width: 100%; font-size: 11px;" id="upgradeBtn">
            <i data-lucide="sparkles" style="width: 13px; height: 13px;"></i> Upgrade to Premium
          </button>
        </div>

        <!-- Light / Dark Mode Switcher -->
        <button class="theme-toggle-btn" id="themeToggleBtn">
          <span style="display: flex; align-items: center; gap: 8px;">
            <i data-lucide="moon" id="themeIcon" style="width: 15px; height: 15px;"></i>
            <span id="themeLabel">Dark Mode</span>
          </span>
          <i data-lucide="repeat" style="width: 12px; height: 12px; opacity: 0.5;"></i>
        </button>
      </div>
    </aside>

    <!-- Main Workspace Container -->
    <main class="main-wrapper">
      <!-- Header Bar -->
      <header class="header-bar">
        <div class="header-title-group">
          <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle navigation menu">
            <i data-lucide="menu"></i>
          </button>
          <h2 class="page-title" id="pageTitle">Home Workspace</h2>
        </div>

        <div class="header-actions">
          <div class="search-input-wrapper">
            <i data-lucide="search"></i>
            <input type="text" class="search-input" id="globalSearchInput" placeholder="Search contacts, docs..." />
          </div>

          <button class="btn btn-primary btn-sm" id="quickNewDocBtn">
            <i data-lucide="plus"></i> <span class="btn-label-text">New Doc</span>
          </button>

          <button class="btn btn-ghost btn-sm" id="btnLockOffice" title="Lock Private Office">
            <i data-lucide="lock" style="width: 15px; height: 15px;"></i>
          </button>
        </div>
      </header>

      <!-- Main Dynamic Content Body -->
      <div class="content-body" id="contentBody">
        <!-- Dynamic view HTML will be rendered here by JS -->
      </div>
    </main>
  </div>

  <!-- App Launch & Private Workspace Entrance Overlay -->
  <div class="auth-overlay hidden" id="authOverlay">
    <div class="auth-card">
      <div class="entrance-logo-wrapper">
        <img src="/logo.svg" alt="dotspace logo" class="entrance-logo-img" />
      </div>

      <h1 class="auth-brand-name">dotspace</h1>
      <p class="auth-tagline">Your work. Professionally organized.</p>

      <div class="auth-user-badge">
        <div class="auth-avatar" id="authAvatar">HV</div>
        <div style="text-align: left;">
          <div style="font-size: 13px; font-weight: 600; color: var(--text-primary);" id="authUserName">Harsha Vardhan</div>
          <div style="font-size: 11px; color: var(--text-muted);" id="authUserEmail">harsha@dotspace.office</div>
        </div>
        <span class="badge" style="margin-left: auto; font-size: 10px;">Private Workspace</span>
      </div>

      <div style="width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 18px;">
        <!-- Official Google Sign-In Button -->
        <button type="button" class="btn btn-google-signin" id="btnGoogleSignIn">
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z" fill="#4285F4"/>
            <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
            <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
          </svg>
          <span>Continue with Google</span>
        </button>

        <div class="auth-divider">
          <span>OR</span>
        </div>

        <form id="authLoginForm" style="width: 100%;">
          <button type="submit" class="btn btn-secondary btn-lg" style="width: 100%; font-size: 13px; padding: 12px 18px; font-weight: 500;">
            Enter Direct Workspace <i data-lucide="arrow-right" style="width: 15px; height: 15px;"></i>
          </button>
        </form>
      </div>

      <div style="margin-top: 22px; font-size: 11px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 6px;">
        <i data-lucide="shield-check" style="width: 14px; height: 14px;"></i> Secure Google Auth • Encrypted Client History
      </div>
    </div>
  </div>

  <!-- Dynamic Modal Overlay Root -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-container" id="modalContainer">
      <!-- Modal HTML injected dynamically -->
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Main JavaScript App Entry -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
